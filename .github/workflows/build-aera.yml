name: Build AERA Recovery

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device codename (TARGET_DEVICE)
        required: true
        default: hummer
      device_tree:
        description: Device tree repo URL, or "local" to use the tree in this repository
        required: true
        default: local
      device_tree_ref:
        description: Device tree branch or tag (ignored when device_tree is "local")
        required: true
        default: main
      device_path:
        description: Device tree path inside the source tree
        required: true
        default: device/oneplus/hummer
      lunch:
        description: Lunch target
        required: true
        default: twrp_hummer-bp2a-eng
      targets:
        description: Make targets
        required: true
        default: adbd recoveryimage
      jobs:
        description: Parallel jobs
        required: true
        default: "2"
      debug:
        description: Publish build telemetry to the ci-status branch
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: aera-${{ inputs.device }}
  cancel-in-progress: false

env:
  WORKDIR: ${{ github.workspace }}/aera_workspace
  MANIFEST_URL: https://github.com/AERA-Recovery/android_manifest.git
  MANIFEST_BRANCH: aera-16.0
  GOGC: "40"
  GOMEMLIMIT: "3GiB"
  ALLOW_MISSING_DEPENDENCIES: "true"

jobs:
  build:
    name: ${{ inputs.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      # maximize-build-space 会重建 /home/runner 挂载点，必须早于 checkout
      - name: Expand disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Report host resources
        run: |
          df -h
          free -h
          nproc
          lsblk -o NAME,SIZE,TYPE,MOUNTPOINT
          sudo pvs --units g
          sudo lvs --units g

      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip unzip curl wget \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc fontconfig \
            python3 python-is-python3 rsync lz4 bc ccache libssl-dev \
            libncurses-dev zram-tools
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          sudo ln -sf "$HOME/bin/repo" /usr/bin/repo
          git config --global user.name "AERA Builder"
          git config --global user.email "builder@users.noreply.github.com"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          repo --version

          printf 'ALGO=zstd\nPERCENT=60\nPRIORITY=100\n' | sudo tee /etc/default/zramswap >/dev/null
          sudo systemctl restart zramswap 2>/dev/null || sudo /usr/sbin/zramswap start 2>/dev/null || true
          swapon --show || true

      - name: Sync manifest
        run: |
          set -euo pipefail
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
          find .repo/manifests -name '*.xml' -exec sed -i 's|ssh://git@github.com/|https://github.com/|g' {} +
          repo sync -c -j8 --no-clone-bundle --no-tags --fail-fast \
            || repo sync -c -j8 --fail-fast
          df -h "$WORKDIR"

      - name: Add device tree
        env:
          TREE_SRC: ${{ inputs.device_tree }}
          TREE_REF: ${{ inputs.device_tree_ref }}
          TREE_PATH: ${{ inputs.device_path }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          mkdir -p "$(dirname "$TREE_PATH")"
          if [ "$TREE_SRC" = "local" ]; then
            cp -a "$GITHUB_WORKSPACE/$TREE_PATH" "$TREE_PATH"
          else
            git clone --depth=1 -b "$TREE_REF" "$TREE_SRC" "$TREE_PATH"
          fi
          # blobs above the API request limit are stored as .xz in this repository
          find "$TREE_PATH" -name '*.xz' -print -exec xz -d {} \;
          ls -la "$TREE_PATH"

      # test/ 与 sdk/ 被 Android.bp 引用（csuite_test 等模块类型），不能删
      - name: Trim source tree
        run: |
          cd "$WORKDIR"
          rm -rf .repo cts platform_testing developers pdk
          df -h "$WORKDIR"

      - name: Build recovery
        run: |
          set -eo pipefail
          cd "$WORKDIR"
          DEV="${{ inputs.device }}"
          export AERA_BUILD_DEVICE="$DEV"
          source build/envsetup.sh

          # Combo names depend on which release configs the manifest actually
          # ships. Only bp2a is guaranteed here; trunk_staging is absent from
          # some point releases and makes release_config abort the whole shell,
          # so every attempt starts from a clean product/release pair.
          ok=0
          for target in "${{ inputs.lunch }}" "aera_${DEV}-bp2a-eng" "twrp_${DEV}-bp2a-eng" "twrp_${DEV}-eng"; do
            unset TARGET_PRODUCT TARGET_RELEASE TARGET_BUILD_VARIANT
            if lunch "$target" >/tmp/lunch.log 2>&1; then
              echo "lunch: $target"
              ok=1
              break
            fi
            echo "lunch failed: $target"
            tail -n 10 /tmp/lunch.log
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::no usable lunch target"
            exit 1
          fi

          df -h "$WORKDIR"
          free -h

          if [ "${{ inputs.debug }}" = "true" ] && [ -f "$GITHUB_WORKSPACE/scripts/watchdog.sh" ]; then
            rm -f "$WORKDIR/build.done"
            nohup bash "$GITHUB_WORKSPACE/scripts/watchdog.sh" "${{ github.repository }}" \
              "${{ secrets.GITHUB_TOKEN }}" "$WORKDIR" "$WORKDIR/build.log" \
              >/tmp/watchdog.log 2>&1 &
            sudo sh -c "echo -1000 > /proc/$!/oom_score_adj" 2>/dev/null || true
          fi

          set +e
          m ${{ inputs.targets }} -j${{ inputs.jobs }} 2>&1 | tee "$WORKDIR/build.log" | tail -n 250
          rc=${PIPESTATUS[0]}
          touch "$WORKDIR/build.done"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$WORKDIR/build.log" "$GITHUB_WORKSPACE/artifacts/" || true

          if [ "$rc" -ne 0 ]; then
            echo "::error::build failed (rc=$rc)"
            grep -i -E "error:|fatal error|failed" "$WORKDIR/build.log" | tail -n 40
            df -h "$WORKDIR"
            free -h
            exit 1
          fi

          find "out/target/product/$DEV" -maxdepth 1 \
            \( -name '*.img' -o -name '*.zip' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aera-${{ inputs.device }}-${{ github.run_number }}
          path: |
            artifacts/*.img
            artifacts/*.zip
            artifacts/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AERA-${{ inputs.device }}-${{ github.run_number }}
          name: AERA Recovery ${{ inputs.device }} build ${{ github.run_number }}
          body: |
            Device: `${{ inputs.device }}`
            Lunch: `${{ inputs.lunch }}`
            Device tree: `${{ inputs.device_path }}` (${{ inputs.device_tree == 'local' && github.repository || inputs.device_tree }})
            AOSP: ${{ env.MANIFEST_BRANCH }}

            Built by GitHub Actions. Test on hardware before flashing.
          files: |
            artifacts/*.img
            artifacts/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
